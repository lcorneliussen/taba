name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Verify locked embedded devtunnel helper
        run: node tools/devtunnel-host/check.mjs
      - name: Validate committed release notes
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo "Expected a vMAJOR.MINOR.PATCH semantic version tag"; exit 1; }
          notes="internal/wtc/release-notes/$version.md"
          test -s "$notes" || { echo "Commit $notes before tagging"; exit 1; }
          heading="$(head -n 1 "$notes")"
          [ "$heading" = "# taba/wtc $version" ] || [ "$heading" = "# taba $version" ] || { echo "Release notes heading does not match tag: expected '# taba/wtc $version' or '# taba $version'"; exit 1; }
          go run ./tools/release-notes check
          go test ./internal/wtc -run '^TestEmbeddedReleaseNotes$'
          echo "path=$notes" >> "$GITHUB_OUTPUT"
      - name: Check Homebrew tap SSH key
        env:
          HOMEBREW_TAP_SSH_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$HOMEBREW_TAP_SSH_PRIVATE_KEY" ]; then
            echo "::error::HOMEBREW_TAP_SSH_PRIVATE_KEY is not set. Add a write deploy key on lcorneliussen/homebrew-taba and store the private key as this Actions secret."
            exit 1
          fi
      # Pinned: this step receives the tap's write deploy key.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: 'v2.19.0'
          args: release --clean --release-notes=${{ steps.notes.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_SSH_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_SSH_PRIVATE_KEY }}
