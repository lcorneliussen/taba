name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Verify locked embedded devtunnel helper
        run: node tools/devtunnel-host/check.mjs
      - name: Install pinned runtime test tools
        run: |
          runtime_archive="$RUNNER_TEMP/dekit.tar.gz"
          runtime_dir="$RUNNER_TEMP/dekit"
          curl --fail --silent --show-error --location https://github.com/pvolok/dekit/releases/download/v0.10.0/dekit-x86_64-unknown-linux-musl.tar.gz --output "$runtime_archive"
          printf '330753d26feb9f96b79a388e730f8bd4414564520257f37bfc997c626b450f44  %s\n' "$runtime_archive" | sha256sum --check -
          mkdir -p "$runtime_dir"
          tar -xzf "$runtime_archive" -C "$runtime_dir" dekit
          docker pull postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
      - name: Test timing helper
        run: python3 -B -m unittest discover -s tools/ci -p '*_test.py'
      - run: |
          export WTC_TEST_NODE="$(node -p 'process.execPath')"
          python3 tools/ci/test-timings.py -timeout 20m ./...
        env:
          WTC_TEST_REQUIRE_RUNTIME: "1"
          WTC_TEST_DEKIT: ${{ runner.temp }}/dekit/dekit
          WTC_TEST_DOCKER_IMAGE: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
      - run: go build ./cmd/taba
      - name: Control UI render tests
        run: node --test openclaw-plugin/test/*.test.mjs
      # Only this step gets the OpenAI secret; without it the test skips.
      - name: Live decision test
        run: node --test openclaw-plugin/test/decisions-live.test.mjs
        env:
          WTC_DECISIONS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  # Unit tests only: the pinned runtime and Docker trials run in the Linux job.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Verify locked embedded devtunnel helper
        run: node tools/devtunnel-host/check.mjs
      # Keep the full suite and its failure diagnostics; report per-test timings.
      - name: Test timing helper
        run: python3 -B -m unittest discover -s tools/ci -p '*_test.py'
      - run: |
          export WTC_TEST_NODE="$(node -p 'process.execPath')"
          python3 tools/ci/test-timings.py -timeout 20m ./...
      - run: go build ./cmd/taba
