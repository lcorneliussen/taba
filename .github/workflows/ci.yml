name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Linter set and exclusions live in .golangci.yml.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fetches ancestor commits and trees without history blobs; the checker reads only
      # the head tree and base..head. A missing or unrelated base fails the step.
      - name: Reject generated Python artifacts in range history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then base="$PR_BASE" head="$PR_HEAD"; else base="$PUSH_BEFORE" head="$PUSH_AFTER"; fi
          unshallow=
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then unshallow=--unshallow; fi
          git fetch --quiet --no-tags $unshallow --filter=blob:none origin "$base" "$head"
          python3 -B tools/ci/check-generated-artifacts.py --base="$base" --head="$head"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Verify locked embedded devtunnel helper
        run: bash tools/release-provenance/verify-helper.sh
      - name: Install pinned runtime test tools
        run: |
          runtime_archive="$RUNNER_TEMP/dekit.tar.gz"
          runtime_dir="$RUNNER_TEMP/dekit"
          curl --fail --silent --show-error --location https://github.com/pvolok/dekit/releases/download/v0.10.0/dekit-x86_64-unknown-linux-musl.tar.gz --output "$runtime_archive"
          printf '330753d26feb9f96b79a388e730f8bd4414564520257f37bfc997c626b450f44  %s\n' "$runtime_archive" | sha256sum --check -
          mkdir -p "$runtime_dir"
          tar -xzf "$runtime_archive" -C "$runtime_dir" dekit
          docker pull postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
      - name: Ensure Lua comparison test runtime
        run: |
          if ! command -v luajit >/dev/null 2>&1 && ! command -v lua >/dev/null 2>&1 && ! command -v lua5.4 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends lua5.4
          fi
          command -v luajit || command -v lua || command -v lua5.4
      - name: Test timing helper
        run: python3 -B -m unittest discover -s tools/ci -p '*_test.py'
      - name: Test upgrade rehearsal
        run: python3 -B -m unittest discover -s tools/upgrade-rehearsal -p '*_test.py'
      - name: Test release provenance
        run: python3 -B -m unittest discover -s tools/release-provenance -p '*_test.py'
      - run: |
          export WTC_TEST_NODE="$(node -p 'process.execPath')"
          python3 tools/ci/test-timings.py -timeout 20m ./...
        env:
          WTC_TEST_REQUIRE_RUNTIME: "1"
          WTC_TEST_DEKIT: ${{ runner.temp }}/dekit/dekit
          WTC_TEST_DOCKER_IMAGE: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
      - run: go build ./cmd/taba
      - name: Control UI render tests
        run: node --test openclaw-plugin/test/*.test.mjs
      # Only this step gets the OpenAI secret; without it the test skips.
      - name: Live decision test
        run: node --test openclaw-plugin/test/decisions-live.test.mjs
        env:
          WTC_DECISIONS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  # main.cfg must hold; each replay and finding config must fail as its first line states.
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Model-check forge cache write ordering
        run: tools/formal/forge-cache-order/check.sh
  # Full native regression coverage runs in macos-full.yml nightly/manual.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate native selection tooling
        run: python3 -B -m unittest discover -s tools/ci -p '*_test.py'
      - name: Native build, smoke and Darwin-sensitive tests
        run: python3 tools/ci/macos-native.py
