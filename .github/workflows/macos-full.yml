name: Full macOS
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-macos-full:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Verify locked embedded devtunnel helper
        run: node tools/devtunnel-host/check.mjs
      # Keep the full suite and its failure diagnostics; report per-test timings.
      - name: Test timing helper
        run: python3 -B -m unittest discover -s tools/ci -p '*_test.py'
      - name: Test upgrade rehearsal
        run: python3 -B -m unittest discover -s tools/upgrade-rehearsal -p '*_test.py'
      - run: |
          export WTC_TEST_NODE="$(node -p 'process.execPath')"
          python3 tools/ci/test-timings.py -timeout 20m ./...
      - run: go build ./cmd/taba
