name: OpenClaw API audit
on:
  pull_request:
    paths: ["tools/openclaw-compat/**", "openclaw-plugin/**", ".github/workflows/openclaw-api-audit.yml"]
  push:
    branches: [main]
    paths: ["tools/openclaw-compat/**", "openclaw-plugin/**", ".github/workflows/openclaw-api-audit.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --prefix tools/openclaw-compat
      - run: npm test --prefix tools/openclaw-compat
      - name: Read the published OpenClaw 2026.11.10 contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: openclaw/openclaw
          ref: 6ea542fd97e2876aa4c871ccc494ed5419a03c5c
          path: .openclaw-host
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /src/plugins/compat/
      - name: Check SDK imports and deprecation candidates
        run: node tools/openclaw-compat/audit.mjs --host .openclaw-host --plugin openclaw-plugin
