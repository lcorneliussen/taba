\* expect: AtMostOnce
\* A design choice the code must keep: Intent.Do removes the marker only after
\* Record saved comment.id. Reversed, a crash between the two leaves neither,
\* and the next post creates the comment again.
SPECIFICATION Spec
CONSTANTS
    Runs = {r1, r2}
    MaxAttempts = 1
    UseMarker = TRUE
    RecheckUnderMarker = TRUE
    RecordBeforeRelease = FALSE
    RetryUnknown = FALSE
    ResultAtReceiver = FALSE
INVARIANTS TypeOK AtMostOnce
