\* expect: pass
\* The design after #498, as open uses it for the agent start: the marker,
\* Intent.Done reading the pane's foreground while the marker is held, busy
\* replies attempted again under the marker. Three runs: overlapping opens
\* and later reruns.
SPECIFICATION Spec
CONSTANTS
    Runs = {r1, r2, r3}
    MaxAttempts = 3
    UseMarker = TRUE
    RecheckUnderMarker = TRUE
    RecordBeforeRelease = TRUE
    RetryUnknown = FALSE
    ResultAtReceiver = TRUE
INVARIANTS TypeOK AtMostOnce
