\* expect: NoEarlierOverwrite
\* Replay of 1b4a2d6^: the data file and then the receipt were two renames,
\* and the receipt's result was ignored. If the process died between them,
\* or the receipt write failed, the entry held a response newer than its
\* receipt, and a writer whose request started in between passed the check
\* and overwrote it (#493). 1b4a2d6 writes the receipt first and ends the
\* write when it fails.
SPECIFICATION Spec
CONSTANTS
    ListWriters = {list1, list2}
    LockedWriters = {refresh, audit, view}
    MaxRequests = 7
    SinceGuard = TRUE
    MergeRules = TRUE
    LockFallthrough = FALSE
    ReceiptFirst = FALSE
    RenameMayFail = TRUE
    None = None
INVARIANTS TypeOK NoEarlierOverwrite
