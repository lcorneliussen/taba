\* expect: pass
\* The design on main: every writer holds the entry lock across the
\* receipt check, the receipt and the publication, and a failed lock ends
\* the write path. The receipt precedes the data and a failed receipt ends
\* the write. Either rename can fail, or the process can die between them.
SPECIFICATION Spec
CONSTANTS
    ListWriters = {list1, list2}
    LockedWriters = {build, unlisted, identity}
    MaxRequests = 7
    SinceGuard = TRUE
    MergeRules = TRUE
    LockFallthrough = FALSE
    ReceiptFirst = TRUE
    RenameMayFail = TRUE
    None = None
INVARIANTS TypeOK NoEarlierOverwrite
