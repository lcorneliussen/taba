\* expect: pass
\* The design on main: every writer holds the entry lock across the
\* receipt check, the publication and the receipt, and a failed lock ends
\* the write path. Assumes the receipt rename follows the data rename
\* (finding-receipt-loss.cfg drops that assumption).
SPECIFICATION Spec
CONSTANTS
    ListWriters = {list1, list2}
    LockedWriters = {refresh, audit, view}
    MaxRequests = 7
    SinceGuard = TRUE
    MergeRules = TRUE
    LockFallthrough = FALSE
    ReceiptMayFail = FALSE
    None = None
INVARIANTS TypeOK NoEarlierOverwrite
