\* expect: NoEarlierOverwrite
\* Finding on main, kept as an expected failure. The data file and the
\* receipt are two renames (status_cache.go:239 and :245). If the process
\* dies between them, or the receipt write fails (its result is ignored),
\* the entry holds a response newer than its receipt, and a writer whose
\* request started in between passes the check and overwrites it.
SPECIFICATION Spec
CONSTANTS
    ListWriters = {list1, list2}
    LockedWriters = {refresh, audit, view}
    MaxRequests = 7
    SinceGuard = TRUE
    MergeRules = TRUE
    LockFallthrough = FALSE
    ReceiptMayFail = TRUE
    None = None
INVARIANTS TypeOK NoEarlierOverwrite
