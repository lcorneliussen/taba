version: 2
project_name: taba
# One program under two names: `taba`, and `wtc` for scripts, mise pins and
# older `wtc upgrade` runs that still call it. The binary picks its display
# name from argv[0] (internal/branding).
builds:
  - &build
    id: taba
    main: ./cmd/wtc
    binary: taba
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
  - <<: *build
    id: wtc
    binary: wtc
archives:
  - id: taba
    ids: [taba, wtc]
    formats: [tar.gz]
    name_template: 'taba_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  name_template: checksums.txt
